name: Feature Request
description: 새로운 기능 제안이나 개선 아이디어를 적을 때 사용합니다.
title: "[feat] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ### ✨ 기능 제안 가이드
        어떤 사용자/시나리오에 도움이 되는지, 현재 동작과의 차이를 함께 적어주시면 좋습니다.

  - type: textarea
    id: problem
    attributes:
      label: 문제 / 동기
      description: 어떤 불편/기회 때문에 이 기능이 필요한가요?
      placeholder: "견적 추적 화면에서 모바일 가독성이 떨어짐"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방향
      description: 어떤 UI/흐름/API 변경이 효과적일까요?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
      description: 있다면 적어 주세요. (없으면 '없음' 이라고 적어도 됩니다.)
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 영향 범위
      description: 어떤 파일/컴포넌트가 영향을 받을 것 같은지 추측을 적어 주세요.
      placeholder: "src/pages/quote/QuoteTrack.tsx, src/styles/theme.css"
    validations:
      required: false
